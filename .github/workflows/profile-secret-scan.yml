name: Profile secret scan

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Reject committed credential patterns
        shell: bash
        run: |
          set -euo pipefail

          if grep -R -n -E \
            --exclude-dir=.git \
            'gho_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9_-]{20,}' .; then
            echo 'Potential credential found in current repository tree.'
            exit 1
          fi

          git diff --check
